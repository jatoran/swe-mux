# Project Actions for swe-mux. Every action here appears in the Run menu.
#
# An action is a manifest entry, not a program: no conditionals, no loops. Logic
# belongs in a script in this repository, with a `process` step pointing at it.
#
# Nothing here runs because it exists. The first run of each action asks a human to
# approve this file's exact bytes, and every edit asks again.
#
# Full reference: src/swe_mux/assets/project-actions-schema.md
version = 1

[[actions]]
id = "verify"
label = "Verify"
description = "The full landing gate: pytest, ruff, mypy, tsc, and the frontend suite."
# `process` rather than `shell`: nothing here needs pipes or redirection, and a
# process step passes args verbatim with no quoting to get wrong.
type = "process"
command = "bash"
args = [".worktree-verify"]
# Roughly ten times a healthy run. A suite that hangs should stop on its own rather
# than hold a pane open until someone notices.
timeout_seconds = 1800

[[actions]]
id = "test"
label = "Test (filtered)"
description = "Backend tests narrowed by a pytest -k expression. Live-agent marks stay excluded."
type = "process"
command = "uv"
args = [
  "run",
  "pytest",
  "tests",
  "-q",
  "-m",
  "not live_agent and not live_subagent and not live_telemetry and not live_quota",
  "-k",
  "${input:pattern}",
]
timeout_seconds = 900

# The value is substituted at run time, so this file's approved bytes describe the
# template rather than any one filled-in command. It sits in `args`, where it is
# quoted for the shell; it could not sit in a `shell` command with no args.
[[actions.inputs]]
id = "pattern"
label = "pytest -k expression"
default = "launch_profile or project_action"

[[actions]]
id = "frontend"
label = "Frontend build"
description = "Rebuild the browser bundle into src/swe_mux/static. Does not reach the frozen app."
type = "process"
command = "npm"
args = ["run", "build"]
cwd = "frontend"
timeout_seconds = 600

[[actions]]
id = "checks"
label = "Lint and types"
description = "Ruff and mypy together, without waiting for the test suite."
# Two steps, started at once because neither reads the other's output. `sequential`
# would only order their starts; it does not wait for one to finish.
[[actions.steps]]
name = "ruff"
type = "process"
command = "uv"
args = ["run", "ruff", "check", "src/swe_mux", "tests", "packaging"]
timeout_seconds = 300

[[actions.steps]]
name = "mypy"
type = "process"
command = "uv"
args = ["run", "mypy"]
timeout_seconds = 600
