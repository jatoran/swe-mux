[project]
name = "swe-mux"
version = "0.1.5"
description = "A browser-based terminal multiplexer for interactive coding agents"
readme = "README.md"
requires-python = ">=3.12"
# Every entry is a claim an installer can check, so each one is what the project
# actually proves rather than what it aspires to.
#
# There is deliberately **no `License ::` classifier**. The license is declared as
# the PEP 639 `license` expression below, and carrying both is an error: build
# backends reject the pair, and a classifier is the legacy spelling of the same
# fact.
#
# The operating-system entries are the honest half. Windows is the proving
# platform - it is where the frozen desktop app ships, where ConPTY is the PTY
# backend, and where the full CI gate runs. Linux runs the daemon and the suite
# from source on the POSIX seam, so it is claimed. macOS is implemented,
# typechecked, and now exercised - its leg runs the whole suite and the install
# smoke - but that leg is `continue-on-error`, so it is not *required* to pass
# and the classifier stays off: a claim an installer can check has to rest on a
# check that can fail the build. `Operating System :: OS Independent` would be
# false about all three, which is a different point and still holds: the wheel
# is pure Python and installs anywhere, while the product is not equally proven
# anywhere.
#
# `Development Status :: 3 - Alpha` matches the distribution rather than the
# feature set. Since 2026-08-28 the wheel installs cleanly from PyPI - CI
# install-smokes it on all three hosts and it was installed by hand into a
# throwaway environment on each of `uv tool`, `pipx`, and `pip` - but that is an
# install, not a *clean machine*: nobody has yet run this on hardware that is not
# the development host, and no CI job on any host starts a daemon
# (`.docs/development/RELEASE_MANUAL_TASKS.md` § 8).
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: System :: Shells",
  "Topic :: Terminals",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
  "Topic :: Utilities",
]
# Declared as a PEP 639 SPDX expression rather than a classifier. Without this the
# wheel shipped no license metadata at all, which reads as all-rights-reserved over
# an Apache-2.0 repository - the one place a permissive project can accidentally
# publish as proprietary. `license-files` carries the texts into the wheel, so an
# installed copy answers the question without needing the repository.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
dependencies = [
  "aiohttp>=3.11",
  # Module-scope imports in `push.py`, which the daemon imports at startup, so
  # the failure mode of leaving them undeclared is a daemon that will not start
  # rather than a degraded feature. Both arrive transitively today through
  # `pywebpush` -> `py-vapid` -> `cryptography`, which is an assumption about a
  # third party's dependency graph rather than a claim this project has checked;
  # a `pywebpush` release that stopped requiring either one would turn an
  # invisible edge into an ImportError at daemon start. Declaring them costs no
  # size at all - they are already installed in every environment - and converts
  # that assumption into something an installer verifies.
  # (`.docs/development/DEPENDENCY_AUDIT_2026-08-28.md` § 6.)
  "cryptography>=44.0",
  # The official MCP client, used only by the Agent Environment tool-catalog
  # fetch to dial a Claude-configured server (`mcp_tools.claude_probe`). swe-mux
  # implements the MCP *server* side itself (`mcp.py`); the client is taken as a
  # dependency rather than written because the value is precisely the part that
  # rots - transport selection and negotiating both the legacy and the 2026
  # stateless protocol revisions. Imported inside the probe, so the daemon does
  # not pay for it at startup; `packaging/swe_mux.spec` collects it explicitly
  # because a lazy import is what PyInstaller's source graph is least likely to
  # follow.
  "mcp>=2.0.0",
  # PyPA's packaging, imported directly by `voice_wheels.
  # wheels_for_this_interpreter` to choose which pinned wheel of the acquired
  # voice closure this interpreter can load. It is the same tag-matching pip and
  # uv use, and the cases that make it worth a dependency are exactly the ones a
  # hand-rolled `(platform, machine, version)` key gets wrong: `cp39-abi3` wheels
  # that load on 3.12, `py2.py3-none-any`, macOS deployment targets.
  #
  # Declared rather than left transitive for the reason `cryptography` and
  # `py-vapid` are, and with a sharper edge: it used to arrive through spaCy and
  # onnxruntime, and those are precisely the packages that no longer ship
  # (ROADMAP Phase 21 Workstream D). An undeclared direct import of a package the
  # bundle just stopped carrying is an ImportError in the code that exists to
  # recover from a missing closure.
  "packaging>=24.0",
  # Pillow is not a Windows feature: Project image presentation is the same
  # capability on every target and Pillow ships wheels for all of them. It was
  # marked win32 only while Windows was the sole host, which then made
  # `project_files` unimportable everywhere else. Its absence is still handled as
  # a degraded capability rather than an import error.
  "pillow>=11.0",
  "psutil>=6.1",
  # The other half of the pair above, and the same reasoning: `push.py` imports
  # `py_vapid` at module scope for the VAPID claim signing.
  "py-vapid>=1.9",
  "pywebpush>=2.0",
  # The tray and the native window. Windows-only by marker, because there is no
  # Linux or macOS desktop app by design (`design/features/desktop-shell.md`), and
  # a *base* dependency on Windows since 2026-08-30 rather than the `desktop`
  # extra it used to be.
  #
  # The extra was the wrong declaration and the cost was paid by the one person
  # least able to absorb it. `[project.gui-scripts]` builds `swe-mux` into every
  # install - `uv tool install` included, measured: subsystem 2 (GUI) against 3
  # (CONSOLE) for the `[project.scripts]` launchers - so a plain `uv tool install
  # swe-mux` shipped a console-free launcher that then died on `ImportError`
  # before it could draw anything. Both remedies it printed led back through a
  # terminal: `uv sync --extra desktop` needs a checkout, and the Settings panel
  # that could acquire the closure needs a running daemon, which needed `muxd`
  # held open in a console. The first-run experience of a desktop app was
  # therefore a modal error and a terminal, over 2.4 MB of pure-Python wheels.
  #
  # 2.4 MB is not a size worth an install-time choice, and the tray is not an
  # optional feature of this product on Windows - it is how the product is
  # started. Declaring it here is what makes `uv tool install swe-mux` followed by
  # `swe-mux` work on a clean machine with no terminal and no network round trip,
  # which is the whole point. Neither package is imported anywhere but
  # `swe_mux.desktop`, so a headless Windows host pays the install and never the
  # import.
  #
  # WebView2 is a *runtime* dependency of pywebview, not an install-time one, so
  # this cannot fail an install on a machine that lacks it; `desktop.py` reports
  # its absence when the window is created.
  "pystray>=0.19.5; sys_platform == 'win32'",
  # Genuinely Windows-only: there is no ConPTY anywhere else. The POSIX target
  # uses the stdlib `pty` module, which needs no third-party dependency.
  "pywinpty>=3.0.2; sys_platform == 'win32'",
  "pywebview>=5.4; sys_platform == 'win32'",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
  # Windows ships no IANA timezone database, so `zoneinfo.ZoneInfo("Europe/Oslo")`
  # raises there and nowhere else. A schedule that names a timezone is exactly
  # the feature that would break on the primary platform without this, and the
  # failure would look like a user error ("unknown timezone") rather than a
  # missing dependency. Marked Windows-only because every POSIX host already has
  # the system database.
  "tzdata>=2024.1; sys_platform == 'win32'",
  "watchfiles>=1.0",
]

[project.urls]
# These strings are what an installed copy and every package index page point
# at, so they are the one place a wrong URL becomes a dead link on the artifact
# rather than in a document that can be edited afterwards.
Homepage = "https://swemux.dev"
Repository = "https://github.com/jatoran/swe-mux"
Documentation = "https://swemux.dev/docs/"
Changelog = "https://github.com/jatoran/swe-mux/blob/master/CHANGELOG.md"
Issues = "https://github.com/jatoran/swe-mux/issues"

# These are console programs: they print tables, reports, and daemon logs, and a
# console is where their output belongs.
#
# **Two names, two programs, and `mux`/`muxd` are deliberately not among them.**
# They were declared as aliases from 2026-08-29 until 2026-08-30, and giving up
# the short name was a decision rather than a tidy-up - so the reasoning is here,
# because the argument that produced the aliases is exactly the one that would
# re-add them.
#
# `mux` is not a name this project can rely on owning. The npm package `mux`
# installs a `mux` executable of its own and is published from the same category
# of tool (0.28.2, 2026-08-12); the repository behind it, `coder/mux`, has since
# renamed itself to `coder/xum`. Why they renamed is not a question this project
# can answer and no claim about it is made here. What is observable is that a
# four-letter name in this category is contested, and that on a machine with both
# installed, PATH order silently decides which one a typed `mux` runs.
#
# The aliases were added on the reasoning that they cost nothing and could be
# revisited from either direction. Both halves were wrong in the same way. They
# do not cost nothing: shipping a launcher under a contested name is what creates
# the collision, and a user whose `mux` resolves to somebody else's tool gets a
# confusing failure from a swe-mux that never runs. And "revisitable from either
# direction" was only true while the documents had not settled - by the time this
# was measured they carried 180 `mux` and 35 `muxd` invocations against 21
# `swemux`, so the cheap direction and the correct one had already diverged.
#
# Removing it is what actually removes the risk: swe-mux now occupies no
# contested name, so nothing of another project's can shadow it. The residual
# case - a `swemux` that PATH does not reach - is diagnosed rather than assumed:
# `install_location.unreachable` is "launchers this install shipped that the bare
# name does not reach", and `swemux doctor` and the daemon's own PATH hint both
# report it.
#
# `tests/test_launcher_names.py` fails on any code span in this repository that
# still tells a reader to run `mux` or `muxd`, because a document naming a
# launcher that no longer exists is the one failure this removal can cause.
[project.scripts]
swemux = "swe_mux.cli:main"
swemuxd = "swe_mux.__main__:main"

# `swe-mux` is the tray and the native window, and it is here rather than above
# because the two tables build different launchers. `[project.scripts]` builds a
# console launcher, so starting the desktop shell popped a console window and
# held it open for the life of the app - beside a native window that is the whole
# point of the shell. `[project.gui-scripts]` builds the `pythonw`-style launcher
# that opens none. `desktop.startup_command` has always reached for `pythonw.exe`
# when it writes the login entry, so the intent was already in the code and only
# the entry point disagreed with it.
#
# The tradeoff this makes, and how it is paid for: a GUI launcher gives the
# process `sys.stdout is None` and `sys.stderr is None`, so a failure before the
# window exists has nowhere to go and becomes *completely* invisible, which is
# worse than a stray console. `desktop.redirect_gui_streams` runs first in
# `main` and points both streams at `<data_dir>/desktop-shell.log`;
# `desktop.report_launch_failure` puts every startup failure in a message box, in
# the lifecycle ledger, and in that log with its traceback. Moving this line
# without those is a net loss (`tests/test_desktop_gui_entry.py` holds the pair
# together).
[project.gui-scripts]
swe-mux = "swe_mux.desktop:main"

[project.optional-dependencies]
# Deliberately empty, and kept rather than deleted. `pystray` and `pywebview`
# moved into base `dependencies` on 2026-08-30 (the reasoning is there), which
# leaves nothing for this extra to add - but `swe-mux[desktop]` is spelled in
# release notes, in the 0.1.x docs, and in whatever scripts readers wrote from
# them, and an *undeclared* extra is a warning plus a silently different install.
# An empty one resolves to exactly what the name has always promised: an install
# that can run the tray. Removing it is a breaking change to a documented string
# for no gain, so it stays until a major version has a reason to move it.
desktop = []
# On-device speech: Kokoro TTS through onnxruntime and faster-whisper dictation,
# with the misaki/spaCy English G2P behind them. Roughly 400 MB of wheels and
# model machinery for a feature the browser's own speech stack and the OS voice
# engine already cover in degraded form, which is why it is optional at install
# time - every call site imports lazily and answers with a typed diagnostic
# naming this extra when it is absent (`kokoro_tts._ensure_loaded`,
# `kokoro_tts._ensure_g2p`, `voice._transcribe_whisper`, `voice.status`).
#
# It is NOT optional at *build* time. The frozen desktop bundle is built from
# this closure, and `num2words` below is LGPL: compliance rests on the spec's
# `collect_all` shipping it as replaceable source under `_internal/num2words/`,
# which a build environment missing the extra silently collects nothing for. So
# `license_audit.DISTRIBUTED_EXTRAS` includes this extra, `build_desktop` refuses
# to build without it, and `redeploy_desktop`'s preflight says so before spending
# minutes on a build that would fail its own license verification.
#
# The spaCy English model misaki's G2P resolves through `spacy.load` is
# deliberately NOT here, and that is the one thing about this extra that is easy
# to get wrong twice. `en-core-web-sm` is published as a GitHub release asset and
# exists on no index, so `[tool.uv.sources]` below is what resolves it - and an
# override is a property of *this* project's resolution, not of published
# metadata. Declaring it here put a bare `Requires-Dist: en-core-web-sm` in the
# wheel, which made `pip install swe-mux[voice-local]` and `uv pip install
# swe-mux[voice-local]` fail outright for every downstream user from 0.1.0's
# release until 2026-08-28 (measured:
# `.docs/development/DEPENDENCY_AUDIT_2026-08-28.md` § 4). A PEP 508 direct URL is
# not a way out either - PyPI rejects distributions whose `Requires-Dist` carries
# one. It now lives in the unpublished `g2p-model` dependency group below, and an
# installed copy that does not have it acquires it the way it already acquires the
# Kokoro weights: `voice_models.SpacyModelStore`, on an explicit press, verified
# against a pinned hash.
voice-local = [
  # `voice._transcribe_whisper` reads `ctranslate2.get_cuda_device_count()` to
  # decide the compute device, and `kokoro_tts`/`voice` build their audio buffers
  # with numpy. Both arrive transitively today (through `faster-whisper` and
  # `onnxruntime` respectively) and both are lazy imports inside features that
  # already answer with a typed diagnostic, so this is the quieter half of the
  # same rule `cryptography` and `py-vapid` carry in `dependencies`: a direct
  # import is a declared dependency, because the alternative is an assumption
  # about somebody else's dependency graph.
  "ctranslate2>=4.4",
  "faster-whisper>=1.2",
  "misaki>=0.9.4",
  "numpy>=1.26",
  # Direct rather than transitive on purpose. `misaki.en` imports it at module
  # scope for the Kokoro G2P, so there is no misaki English path without it, and
  # it is LGPL-2.1: an explicit declaration is what documents the runtime
  # requirement that the frozen build's `collect_all("num2words")` exists to
  # satisfy - it must ship as replaceable source under `_internal/num2words/`
  # for the relink condition, which `build_desktop.verify_bundle_licenses`
  # proves against the built tree. `packaging/license_audit.py` allowlists it
  # with that reasoning. Declaring `misaki[en]` instead would resolve the same
  # closure and change nothing about the compliance mechanism, while hiding the
  # one dependency the bundle has an obligation about.
  "num2words>=0.5.14",
  "onnxruntime>=1.27.0",
  "spacy>=3.8.15",
]
preview-capture = [
  "playwright>=1.49",
]
voice-edge = [
  # Source-install convenience only. The runtime still calls it through the
  # external bridge, and the frozen desktop spec excludes the LGPL package even
  # when the build environment happens to have this extra installed.
  "edge-tts==7.2.8",
]
[dependency-groups]
# PEP 735 groups are never published: a wheel's `METADATA` carries
# `Provides-Extra` for the four extras above and no group content at all. That
# property is what makes this the right home for `en-core-web-sm` - see the note
# on `voice-local`. The model is still resolved for every environment that needs
# it, because `dev` and `package` each include this group: `uv sync` (dev is uv's
# default group) covers the development checkout, `.worktree-setup`, and both CI
# legs, so the real-G2P tests in `test_kokoro_tts.py` keep running rather than
# turning into silent `importorskip` skips; `uv sync --group package` covers the
# desktop build, whose `collect_all("en_core_web_sm")` in `packaging/swe_mux.spec`
# needs it installed. `license_audit.DISTRIBUTED_GROUPS` names this group for the
# same reason `DISTRIBUTED_EXTRAS` names `voice-local`: it is not published, but
# it *is* redistributed inside the desktop bundle, and a closure walk that could
# not see it would report a bundle it does not describe.
g2p-model = [
  "en-core-web-sm",
]
dev = [
  { include-group = "g2p-model" },
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  # The gate runs the suite across the host's cores. `--dist loadgroup` is the
  # only distribution mode that honours `xdist_group`, which is what pins the
  # real-console tests to a single worker (see `[tool.pytest.ini_options]`).
  "pytest-xdist>=3.6",
  "ruff>=0.11",
]
package = [
  { include-group = "g2p-model" },
  "pyinstaller>=6.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_mux"]
artifacts = [
  "src/swe_mux/static/**",
  "!src/swe_mux/static/**/*.gz",
  "src/swe_mux/assets/**",
]
# The precompressed sidecars are the one part of the static tree a distribution
# must NOT carry, and the measurement is unambiguous: 40 `.gz` members, 4.43 MiB
# of a 12.70 MiB wheel, every one of them with its plain sibling in the same
# archive - 35% of the download spent re-shipping content the zip container has
# already compressed once (`.docs/development/DEPENDENCY_AUDIT_2026-08-28.md`
# § 1).
#
# They are not dropped, they are *moved*: `build_support.precompress_static`
# regenerates the whole set in 0.93 s on first daemon start, and the daemon runs
# it as a named startup phase, so what a browser is served is unchanged. Dropping
# them without that would be a large regression rather than a wash - aiohttp does
# no on-the-fly compression for `add_static`, so a phone over Tailscale would
# fetch the 10.7 MiB ONNX runtime uncompressed.
#
# The exclusion is a **negated artifact pattern**, not an `exclude` entry, and
# that is not a style choice: `BuilderConfig.include_path` tests
# `path_is_artifact` first and short-circuits on it, so an `exclude` beside these
# patterns is read, matched, and then ignored - the sidecars ship anyway, and the
# build says nothing. `artifacts` is a `pathspec.GitIgnoreSpec`, so gitignore
# negation applies and the last matching line wins.
#
# The exclusion is what makes this a packaging decision rather than a build-order
# one: `frontend/scripts/compress-static.mjs` still writes the sidecars, because a
# `npm run build` that left the *previous* build's `index.html.gz` beside fresh
# content-hashed assets is a blank screen on a running daemon. They exist in every
# checkout and in the desktop bundle, and are simply not put in a distribution.


# The same artifacts on the sdist, and this is load-bearing rather than tidy.
#
# `src/swe_mux/static/**` is gitignored build output, so hatchling excludes it
# from an sdist unless it is named here. A bare `uv build` does NOT build the
# wheel from the working tree: it builds the sdist first and then builds the
# wheel *from that sdist*, which it says out loud ("Building wheel from source
# distribution"). So without this the release pipeline produced a 258-entry
# wheel with no UI at all, while a local `uv build --wheel` - which does build
# straight from the tree - produced a correct 346-entry one. The failure is
# silent at install time and only appears in a browser.
#
# `packaging/verify_release_artifact.py` caught it on the first real release
# run, which is what it exists for; this is the root fix behind that gate.
# It also closes the gap `release.yml` recorded: an sdist that carries the
# bundle is one a distro packager can rebuild a working wheel from.
#
# The `.gz` negation is repeated here for a reason the paragraph above already
# names: `uv build` builds the sdist first and the wheel *from that sdist*, so a
# sidecar that survived into the sdist would come straight back out in the wheel.
[tool.hatch.build.targets.sdist]
artifacts = [
  "src/swe_mux/static/**",
  "!src/swe_mux/static/**/*.gz",
  "src/swe_mux/assets/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_agent: invokes an authenticated provider CLI and may consume quota",
  "live_subagent: extended live canary that asks the provider to spawn a subagent",
  "live_telemetry: authenticated provider CLI telemetry-to-store conformance canary",
  "live_quota: non-mutating authenticated provider quota schema canary",
  "live_automations: runs a real agent whose facts drive Tier 0 -> detectors -> mux memory tools in-process",
  "live_mcp: drives an isolated daemon on an ephemeral port and a real agent's session through the /mcp wire",
  "live_edge_tts: sends a fixed non-sensitive sentence to the unofficial Microsoft Edge TTS service",
  "live_daemon: starts a real daemon on an ephemeral port and drives a shell session end to end",
  "live_model_flag: runs each installed agent CLI to re-verify its declared model flag and listing",
  "conpty: real Windows ConPTY integration test; spawns a live shell (Windows-only)",
]

# A new warning fails the run. A warning is the library telling us something is
# wrong or about to break, and a suite that prints eighteen of them is a suite
# where the nineteenth is invisible - which is how the aiohttp `AppKey`
# deprecation went unread across ~632 call sites until S3.4 (see
# `.docs/development/CODE_QUALITY_AUDIT_2026-08-23.md` finding 28).
#
# The floor this starts from is zero: the last three (a non-raw docstring
# containing `\w`, a redundant module-level `pytest.mark.asyncio` on a file with
# six sync tests, and a post-start `app[key] = ...` write) were fixed in S12.4
# rather than listed here.
#
# **Every entry below is an exception with a date and a reason, and is expected
# to be removed.** Add one only for a warning that is not ours to fix; fix ours.
filterwarnings = [
  "error",
  # `ResourceWarning` fires when the garbage collector gets to an unclosed
  # handle, not when the leak happens, so under `-n auto` it is attributed to
  # whichever test happened to allocate next and its count varies run to run
  # (13 in one measured run, from four different subsystems). Promoting it would
  # redden the gate over machine load rather than over the code - the same
  # failure mode CLAUDE.md records for fixed `asyncio.sleep` calls. Restored to
  # Python's own default for this category, which is to ignore it; `-W
  # error::ResourceWarning` on the command line still overrides this for anyone
  # hunting a leak deliberately, and that is how the two real ones this ratchet
  # found (`adapters/codex.py`, `observation.py`) were fixed.
  # Reviewed 2026-08-24; this one is structural, not a fix owed.
  "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C901"]
ignore = ["ASYNC240"]

# A ratchet, not a style rule: the threshold is today's worst function, so nothing
# has to be refactored to turn it on and nothing may be written worse than the worst
# thing already here. It steps down as the named offenders come down; the plan and
# its measurements live in `.docs/development/archive/ROADMAP_V2.md` § S12.
#
# 2026-08-24: 88, which is `server._build_runtime_handles` - the composition root,
# and now the maximum. It took over from `config._validate`, which was 170 (twice
# anything else in the codebase) until S12.3 table-drove its 103 mechanical range,
# choice, and bounded-string checks down to 76.
[tool.ruff.lint.mccabe]
max-complexity = 88

[tool.ruff.lint.per-file-ignores]
# windows_firewall.py embeds PowerShell scripts as f-strings; their pipeline
# lines legitimately exceed the 100-column limit and cannot wrap cleanly.
"src/swe_mux/windows_firewall.py" = ["E501"]
# voice_wheels.py is generated by `packaging/generate_voice_pins.py` from
# `uv.lock`, one line per pinned wheel. A PyPI download URL carries a 64-character
# content hash in its path and is on its own over 100 columns, so the limit cannot
# be met by wrapping - only by rendering each pin across four lines, which would
# make a 393-entry table 1600 lines of diff that nobody reads. One line per pin is
# a diff where a changed pin is visibly one changed pin.
"src/swe_mux/voice_wheels.py" = ["E501"]
# Same shape, same reasoning: generated by `packaging/generate_desktop_pins.py`,
# one line per pin.
"src/swe_mux/desktop_wheels.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["swe_mux"]
ignore_missing_imports = true
# Pinned rather than inherited from the host, because without it this pass asks a
# different question on every runner and cannot be green on all of them at once.
# Five modules reach Win32 directly through `ctypes.WinDLL`/`windll` and `winreg`
# (`desktop.py`, `agent_launcher.py`, `ghost_windows.py`, `file_manager.py`,
# `timer_resolution.py`). They are not in the per-platform override below because
# on Windows they typecheck normally - which is why this went unnoticed while
# Windows was the only host that ever ran mypy. The first CI run on Linux found
# all 35 errors immediately.
# `win32` is the right pin rather than an arbitrary one: it is the proving
# platform, and pinning it keeps those five fully checked everywhere instead of
# silencing them with `ignore_errors`. The POSIX side loses nothing, because the
# `--platform linux` pass in `mypy-platform.toml` is what owns it.
platform = "win32"

# The per-platform implementation modules are uncheckable in this pass, because
# mypy resolves `os.killpg`, `pty.fork`, and `ctypes.windll` against the typeshed
# view of *this* host: half of them do not exist here whichever host that is.
#
# They are not left unchecked. `mypy-platform.toml` drives two further passes,
# one per `--platform`, that check exactly these modules with strict errors on.
# That is stronger than the shipped single pass, not weaker: today a POSIX-only
# call is typechecked on Windows and a Win32-only call is typechecked on Linux,
# so neither implementation can rot while the other host is the one being
# developed on.
[[tool.mypy.overrides]]
module = [
  "swe_mux.posix_guardian",
  "swe_mux.posix_process_group",
  "swe_mux.pty_backend_posix",
  "swe_mux.pty_backend_windows",
  "swe_mux.secret_cipher_windows",
  "swe_mux.win_jobobj",
]
ignore_errors = true

[tool.uv]
# `faster-whisper` hard-requires `av>=11`, and PyAV's wheel carries 63 MB of
# FFmpeg linked against GPL x264/x265 (`packaging/license_audit.py`'s
# MISDECLARED entry records the measurement; PyAV itself declares BSD-3-Clause).
# Nothing in swe-mux reaches it: the only import is `faster_whisper/audio.py`'s
# module-level `import av` for `decode_audio`, and `voice.py` hands validated
# raw PCM straight to `WhisperModel`.
#
# So it is dropped rather than replaced. An override carrying a marker no
# environment can satisfy removes the edge from the resolution entirely, which
# is what takes `av` out of `uv.lock` and therefore out of both the closure
# `license_audit.python_closure()` walks and what `uv sync` installs.
# `swe_mux.av_stub` puts a stub in `sys.modules` before `faster_whisper` is
# imported, so the import that motivated the dependency still succeeds and any
# *use* of PyAV raises at the call site instead of silently needing the GPL
# payload back. The frozen bundle reaches the same end by a different route
# (`excludes=["av"]` plus `packaging/rthook_av_stub.py`), and both call the same
# `install()`.
#
# Scope, stated precisely because it is easy to overread: an override is a
# property of *this* project's resolution, not of the published metadata. It
# governs `uv.lock`, `uv sync`, `uv pip install <this checkout>`, and every
# artifact built from them - the desktop bundle and the verification gate
# included. It is NOT carried in the wheel's `Requires-Dist`, so a downstream
# `pip install swe-mux[voice-local]` still resolves faster-whisper's own
# declared `av>=11`. Closing that last gap needs faster-whisper to make `av`
# optional upstream (or a `--override`/constraint on the installing side); the
# stub is what makes it a size-and-diligence question rather than a broken
# feature, because swe-mux never imports the real package either way.
override-dependencies = ["av; sys_platform == 'swe-mux-drops-pyav'"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
