[project]
name = "swe-mux"
version = "0.1.0"
description = "A browser-based terminal multiplexer for interactive coding agents"
readme = "README.md"
requires-python = ">=3.12"
# Every entry is a claim an installer can check, so each one is what the project
# actually proves rather than what it aspires to.
#
# There is deliberately **no `License ::` classifier**. The license is declared as
# the PEP 639 `license` expression below, and carrying both is an error: build
# backends reject the pair, and a classifier is the legacy spelling of the same
# fact.
#
# The operating-system entries are the honest half. Windows is the proving
# platform - it is where the frozen desktop app ships, where ConPTY is the PTY
# backend, and where the full CI gate runs. Linux runs the daemon and the suite
# from source on the POSIX seam, so it is claimed. macOS is implemented,
# typechecked, and now exercised - its leg runs the whole suite and the install
# smoke - but that leg is `continue-on-error`, so it is not *required* to pass
# and the classifier stays off: a claim an installer can check has to rest on a
# check that can fail the build. `Operating System :: OS Independent` would be
# false about all three, which is a different point and still holds: the wheel
# is pure Python and installs anywhere, while the product is not equally proven
# anywhere.
#
# `Development Status :: 3 - Alpha` matches the distribution rather than the
# feature set. Since 2026-08-28 the wheel installs cleanly from PyPI - CI
# install-smokes it on all three hosts and it was installed by hand into a
# throwaway environment on each of `uv tool`, `pipx`, and `pip` - but that is an
# install, not a *clean machine*: nobody has yet run this on hardware that is not
# the development host, and no CI job on any host starts a daemon
# (`.docs/development/RELEASE_MANUAL_TASKS.md` § 8).
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: System :: Shells",
  "Topic :: Terminals",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
  "Topic :: Utilities",
]
# Declared as a PEP 639 SPDX expression rather than a classifier. Without this the
# wheel shipped no license metadata at all, which reads as all-rights-reserved over
# an Apache-2.0 repository - the one place a permissive project can accidentally
# publish as proprietary. `license-files` carries the texts into the wheel, so an
# installed copy answers the question without needing the repository.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
dependencies = [
  "aiohttp>=3.11",
  # The official MCP client, used only by the Agent Environment tool-catalog
  # fetch to dial a Claude-configured server (`mcp_tools.claude_probe`). swe-mux
  # implements the MCP *server* side itself (`mcp.py`); the client is taken as a
  # dependency rather than written because the value is precisely the part that
  # rots - transport selection and negotiating both the legacy and the 2026
  # stateless protocol revisions. Imported inside the probe, so the daemon does
  # not pay for it at startup; `packaging/swe_mux.spec` collects it explicitly
  # because a lazy import is what PyInstaller's source graph is least likely to
  # follow.
  "mcp>=2.0.0",
  # Pillow is not a Windows feature: Project image presentation is the same
  # capability on every target and Pillow ships wheels for all of them. It was
  # marked win32 only while Windows was the sole host, which then made
  # `project_files` unimportable everywhere else. Its absence is still handled as
  # a degraded capability rather than an import error.
  "pillow>=11.0",
  "psutil>=6.1",
  "pywebpush>=2.0",
  # Genuinely Windows-only: there is no ConPTY anywhere else. The POSIX target
  # uses the stdlib `pty` module, which needs no third-party dependency.
  "pywinpty>=3.0.2; sys_platform == 'win32'",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
  # Windows ships no IANA timezone database, so `zoneinfo.ZoneInfo("Europe/Oslo")`
  # raises there and nowhere else. A schedule that names a timezone is exactly
  # the feature that would break on the primary platform without this, and the
  # failure would look like a user error ("unknown timezone") rather than a
  # missing dependency. Marked Windows-only because every POSIX host already has
  # the system database.
  "tzdata>=2024.1; sys_platform == 'win32'",
  "watchfiles>=1.0",
]

[project.urls]
# These strings are what an installed copy and every package index page point
# at, so they are the one place a wrong URL becomes a dead link on the artifact
# rather than in a document that can be edited afterwards.
Homepage = "https://swemux.dev"
Repository = "https://github.com/jatoran/swe-mux"
Documentation = "https://swemux.dev/docs/"
Changelog = "https://github.com/jatoran/swe-mux/blob/master/CHANGELOG.md"
Issues = "https://github.com/jatoran/swe-mux/issues"

[project.scripts]
mux = "swe_mux.cli:main"
muxd = "swe_mux.__main__:main"
swe-mux = "swe_mux.desktop:main"

[project.optional-dependencies]
desktop = [
  "pystray>=0.19.5; sys_platform == 'win32'",
  "pywebview>=5.4; sys_platform == 'win32'",
]
# On-device speech: Kokoro TTS through onnxruntime and faster-whisper dictation,
# with the misaki/spaCy English G2P behind them. Roughly 400 MB of wheels and
# model machinery for a feature the browser's own speech stack and the OS voice
# engine already cover in degraded form, which is why it is optional at install
# time - every call site imports lazily and answers with a typed diagnostic
# naming this extra when it is absent (`kokoro_tts._ensure_loaded`,
# `kokoro_tts._ensure_g2p`, `voice._transcribe_whisper`, `voice.status`).
#
# It is NOT optional at *build* time. The frozen desktop bundle is built from
# this closure, and `num2words` below is LGPL: compliance rests on the spec's
# `collect_all` shipping it as replaceable source under `_internal/num2words/`,
# which a build environment missing the extra silently collects nothing for. So
# `license_audit.DISTRIBUTED_EXTRAS` includes this extra, `build_desktop` refuses
# to build without it, and `redeploy_desktop`'s preflight says so before spending
# minutes on a build that would fail its own license verification.
voice-local = [
  # The spaCy English model misaki's G2P resolves through `spacy.load`, taken as
  # a URL dependency (see `[tool.uv.sources]`) because it is not on PyPI.
  "en-core-web-sm",
  "faster-whisper>=1.2",
  "misaki>=0.9.4",
  # Direct rather than transitive on purpose. `misaki.en` imports it at module
  # scope for the Kokoro G2P, so there is no misaki English path without it, and
  # it is LGPL-2.1: an explicit declaration is what documents the runtime
  # requirement that the frozen build's `collect_all("num2words")` exists to
  # satisfy - it must ship as replaceable source under `_internal/num2words/`
  # for the relink condition, which `build_desktop.verify_bundle_licenses`
  # proves against the built tree. `packaging/license_audit.py` allowlists it
  # with that reasoning. Declaring `misaki[en]` instead would resolve the same
  # closure and change nothing about the compliance mechanism, while hiding the
  # one dependency the bundle has an obligation about.
  "num2words>=0.5.14",
  "onnxruntime>=1.27.0",
  "spacy>=3.8.15",
]
preview-capture = [
  "playwright>=1.49",
]
voice-edge = [
  # Source-install convenience only. The runtime still calls it through the
  # external bridge, and the frozen desktop spec excludes the LGPL package even
  # when the build environment happens to have this extra installed.
  "edge-tts==7.2.8",
]
[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  # The gate runs the suite across the host's cores. `--dist loadgroup` is the
  # only distribution mode that honours `xdist_group`, which is what pins the
  # real-console tests to a single worker (see `[tool.pytest.ini_options]`).
  "pytest-xdist>=3.6",
  "ruff>=0.11",
]
package = [
  "pyinstaller>=6.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_mux"]
artifacts = ["src/swe_mux/static/**", "src/swe_mux/assets/**"]

# The same artifacts on the sdist, and this is load-bearing rather than tidy.
#
# `src/swe_mux/static/**` is gitignored build output, so hatchling excludes it
# from an sdist unless it is named here. A bare `uv build` does NOT build the
# wheel from the working tree: it builds the sdist first and then builds the
# wheel *from that sdist*, which it says out loud ("Building wheel from source
# distribution"). So without this the release pipeline produced a 258-entry
# wheel with no UI at all, while a local `uv build --wheel` - which does build
# straight from the tree - produced a correct 346-entry one. The failure is
# silent at install time and only appears in a browser.
#
# `packaging/verify_release_artifact.py` caught it on the first real release
# run, which is what it exists for; this is the root fix behind that gate.
# It also closes the gap `release.yml` recorded: an sdist that carries the
# bundle is one a distro packager can rebuild a working wheel from.
[tool.hatch.build.targets.sdist]
artifacts = ["src/swe_mux/static/**", "src/swe_mux/assets/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_agent: invokes an authenticated provider CLI and may consume quota",
  "live_subagent: extended live canary that asks the provider to spawn a subagent",
  "live_telemetry: authenticated provider CLI telemetry-to-store conformance canary",
  "live_quota: non-mutating authenticated provider quota schema canary",
  "live_automations: runs a real agent whose facts drive Tier 0 -> detectors -> mux memory tools in-process",
  "live_mcp: drives an isolated daemon on an ephemeral port and a real agent's session through the /mcp wire",
  "live_edge_tts: sends a fixed non-sensitive sentence to the unofficial Microsoft Edge TTS service",
  "conpty: real Windows ConPTY integration test; spawns a live shell (Windows-only)",
]

# A new warning fails the run. A warning is the library telling us something is
# wrong or about to break, and a suite that prints eighteen of them is a suite
# where the nineteenth is invisible - which is how the aiohttp `AppKey`
# deprecation went unread across ~632 call sites until S3.4 (see
# `.docs/development/CODE_QUALITY_AUDIT_2026-08-23.md` finding 28).
#
# The floor this starts from is zero: the last three (a non-raw docstring
# containing `\w`, a redundant module-level `pytest.mark.asyncio` on a file with
# six sync tests, and a post-start `app[key] = ...` write) were fixed in S12.4
# rather than listed here.
#
# **Every entry below is an exception with a date and a reason, and is expected
# to be removed.** Add one only for a warning that is not ours to fix; fix ours.
filterwarnings = [
  "error",
  # `ResourceWarning` fires when the garbage collector gets to an unclosed
  # handle, not when the leak happens, so under `-n auto` it is attributed to
  # whichever test happened to allocate next and its count varies run to run
  # (13 in one measured run, from four different subsystems). Promoting it would
  # redden the gate over machine load rather than over the code - the same
  # failure mode CLAUDE.md records for fixed `asyncio.sleep` calls. Restored to
  # Python's own default for this category, which is to ignore it; `-W
  # error::ResourceWarning` on the command line still overrides this for anyone
  # hunting a leak deliberately, and that is how the two real ones this ratchet
  # found (`adapters/codex.py`, `observation.py`) were fixed.
  # Reviewed 2026-08-24; this one is structural, not a fix owed.
  "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C901"]
ignore = ["ASYNC240"]

# A ratchet, not a style rule: the threshold is today's worst function, so nothing
# has to be refactored to turn it on and nothing may be written worse than the worst
# thing already here. It steps down as the named offenders come down; the plan and
# its measurements live in `.docs/development/archive/ROADMAP_V2.md` § S12.
#
# 2026-08-24: 88, which is `server._build_runtime_handles` - the composition root,
# and now the maximum. It took over from `config._validate`, which was 170 (twice
# anything else in the codebase) until S12.3 table-drove its 103 mechanical range,
# choice, and bounded-string checks down to 76.
[tool.ruff.lint.mccabe]
max-complexity = 88

[tool.ruff.lint.per-file-ignores]
# windows_firewall.py embeds PowerShell scripts as f-strings; their pipeline
# lines legitimately exceed the 100-column limit and cannot wrap cleanly.
"src/swe_mux/windows_firewall.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["swe_mux"]
ignore_missing_imports = true
# Pinned rather than inherited from the host, because without it this pass asks a
# different question on every runner and cannot be green on all of them at once.
# Five modules reach Win32 directly through `ctypes.WinDLL`/`windll` and `winreg`
# (`desktop.py`, `agent_launcher.py`, `ghost_windows.py`, `file_manager.py`,
# `timer_resolution.py`). They are not in the per-platform override below because
# on Windows they typecheck normally - which is why this went unnoticed while
# Windows was the only host that ever ran mypy. The first CI run on Linux found
# all 35 errors immediately.
# `win32` is the right pin rather than an arbitrary one: it is the proving
# platform, and pinning it keeps those five fully checked everywhere instead of
# silencing them with `ignore_errors`. The POSIX side loses nothing, because the
# `--platform linux` pass in `mypy-platform.toml` is what owns it.
platform = "win32"

# The per-platform implementation modules are uncheckable in this pass, because
# mypy resolves `os.killpg`, `pty.fork`, and `ctypes.windll` against the typeshed
# view of *this* host: half of them do not exist here whichever host that is.
#
# They are not left unchecked. `mypy-platform.toml` drives two further passes,
# one per `--platform`, that check exactly these modules with strict errors on.
# That is stronger than the shipped single pass, not weaker: today a POSIX-only
# call is typechecked on Windows and a Win32-only call is typechecked on Linux,
# so neither implementation can rot while the other host is the one being
# developed on.
[[tool.mypy.overrides]]
module = [
  "swe_mux.posix_guardian",
  "swe_mux.posix_process_group",
  "swe_mux.pty_backend_posix",
  "swe_mux.pty_backend_windows",
  "swe_mux.secret_cipher_windows",
  "swe_mux.win_jobobj",
]
ignore_errors = true

[tool.uv]
# `faster-whisper` hard-requires `av>=11`, and PyAV's wheel carries 63 MB of
# FFmpeg linked against GPL x264/x265 (`packaging/license_audit.py`'s
# MISDECLARED entry records the measurement; PyAV itself declares BSD-3-Clause).
# Nothing in swe-mux reaches it: the only import is `faster_whisper/audio.py`'s
# module-level `import av` for `decode_audio`, and `voice.py` hands validated
# raw PCM straight to `WhisperModel`.
#
# So it is dropped rather than replaced. An override carrying a marker no
# environment can satisfy removes the edge from the resolution entirely, which
# is what takes `av` out of `uv.lock` and therefore out of both the closure
# `license_audit.python_closure()` walks and what `uv sync` installs.
# `swe_mux.av_stub` puts a stub in `sys.modules` before `faster_whisper` is
# imported, so the import that motivated the dependency still succeeds and any
# *use* of PyAV raises at the call site instead of silently needing the GPL
# payload back. The frozen bundle reaches the same end by a different route
# (`excludes=["av"]` plus `packaging/rthook_av_stub.py`), and both call the same
# `install()`.
#
# Scope, stated precisely because it is easy to overread: an override is a
# property of *this* project's resolution, not of the published metadata. It
# governs `uv.lock`, `uv sync`, `uv pip install <this checkout>`, and every
# artifact built from them - the desktop bundle and the verification gate
# included. It is NOT carried in the wheel's `Requires-Dist`, so a downstream
# `pip install swe-mux[voice-local]` still resolves faster-whisper's own
# declared `av>=11`. Closing that last gap needs faster-whisper to make `av`
# optional upstream (or a `--override`/constraint on the installing side); the
# stub is what makes it a size-and-diligence question rather than a broken
# feature, because swe-mux never imports the real package either way.
override-dependencies = ["av; sys_platform == 'swe-mux-drops-pyav'"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
