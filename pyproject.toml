[project]
name = "swe-mux"
version = "0.1.0"
description = "A browser-based terminal multiplexer for interactive coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11",
  "psutil>=6.1",
  "pywinpty>=3.0.2; sys_platform == 'win32'",
  "watchfiles>=1.0",
]

[project.scripts]
mux = "swe_mux.cli:main"
muxd = "swe_mux.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_mux"]
artifacts = ["src/swe_mux/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["swe_mux"]
ignore_missing_imports = true
