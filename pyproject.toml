[project]
name = "swe-mux"
version = "0.1.0"
description = "A browser-based terminal multiplexer for interactive coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11",
  "edge-tts>=7.0",
  "faster-whisper>=1.2",
  "psutil>=6.1",
  "pywinpty>=3.0.2; sys_platform == 'win32'",
  "watchfiles>=1.0",
]

[project.scripts]
mux = "swe_mux.cli:main"
muxd = "swe_mux.__main__:main"
swe-mux = "swe_mux.desktop:main"

[project.optional-dependencies]
desktop = [
  "pillow>=11.0; sys_platform == 'win32'",
  "pystray>=0.19.5; sys_platform == 'win32'",
  "pywebview>=5.4; sys_platform == 'win32'",
]
[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]
package = [
  "pyinstaller>=6.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_mux"]
artifacts = ["src/swe_mux/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_agent: invokes an authenticated provider CLI and may consume quota",
  "live_subagent: extended live canary that asks the provider to spawn a subagent",
  "live_telemetry: authenticated provider CLI telemetry-to-store conformance canary",
  "live_quota: non-mutating authenticated provider quota schema canary",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["swe_mux"]
ignore_missing_imports = true
