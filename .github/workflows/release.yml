# Release automation for swe-mux: build, validate, publish, announce.
#
# One workflow rather than four, because the four steps are one release unit -
# a wheel that reached PyPI but never got its hashes into the update manifest is
# a release that silently cannot be upgraded to, and splitting them across
# workflows is how that state becomes reachable.
#
# The trigger is a `v*` tag push. `workflow_dispatch` exists for exactly one
# reason: publishing an alpha to TestPyPI first, which Roadmap Phase 11 requires
# before the real name is reserved on PyPI. That path deliberately stops after
# publishing - it creates no GitHub Release and touches no update manifest,
# because a validation run must not tell every installed copy that a new version
# is out.
#
# Nothing here holds a credential. Publishing uses PyPI Trusted Publishing over
# OIDC (`id-token: write`), so there is no API token in the repository, in an
# environment, or in this file - which is the whole point: a token that does not
# exist cannot leak, and a compromised workflow file cannot mint one because the
# identity is bound to this repository, this workflow, and this environment on
# PyPI's side. The only credential referenced anywhere is `github.token`, the
# per-run automatic token, which is not a stored secret and expires with the job.
#
# The build runs on ubuntu even though swe-mux is Windows-first: the wheel is
# pure Python and platform-independent, so building it on the cheapest runner is
# free, and building it on Windows would only make the artifact's provenance
# harder to reproduce. Correctness on Windows is `ci.yml`'s question, and a tag
# is only pushed to a commit that already passed it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      index:
        description: "Which package index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]

# Least privilege by default; each job widens only what it needs. The publish
# jobs need `id-token: write` and nothing else - notably not `contents: write`,
# so a compromised publish step cannot rewrite the repository it published from.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
      wheel: ${{ steps.artifacts.outputs.wheel }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      # Kept in step with `ci.yml`, which had to move to 22 because `npm test`
      # needs `--experimental-strip-types`. The release build does not run that
      # script, so 20 would still work here - but a release that builds the
      # shipped bundle on a different Node from the one CI proved it on is the
      # kind of difference nobody looks for when an artifact misbehaves.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm --prefix frontend ci

      # This step is load-bearing, not a convenience. `src/swe_mux/static`'s
      # hashed assets and `index.html` are gitignored build output, and
      # `[tool.hatch.build.targets.wheel] artifacts` is what pulls them into the
      # wheel anyway. So a wheel built from a bare checkout installs cleanly,
      # starts the daemon, and serves no UI at all - the failure is silent, it
      # only appears in a browser, and no test catches it. Building the frontend
      # immediately before `uv build`, in the same checkout, is what makes the
      # bundle provably the same revision as the Python code beside it.
      - name: Build frontend into the package
        run: npm --prefix frontend run build

      # Both artifacts, always. The gap this comment used to record - an sdist
      # with no frontend bundle, from which a rebuilt wheel would be UI-less -
      # was closed in `pyproject.toml` by giving `[tool.hatch.build.targets.sdist]`
      # the same `artifacts` glob as the wheel target, exactly where the old
      # comment said the fix belonged. It turned out to be load-bearing rather
      # than tidy: a bare `uv build` builds the sdist first and then builds the
      # wheel *from that sdist*, so the missing glob was silently shipping a
      # UI-less wheel from this very step. The sdist is still published for
      # auditability and for distro packagers; `pip install swe-mux` resolves
      # the wheel.
      - name: Build wheel and sdist
        run: uv build

      - name: Identify the artifacts
        id: artifacts
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built $wheel (version $version)"

      # A tag and the version it claims to be are two independent facts, and they
      # have disagreed in every project that did not check. The manifest, the
      # release page, and the download URLs are all keyed by the tag while the
      # installed package reports the metadata version, so a mismatch makes the
      # update check compare the wrong pair of numbers forever.
      - name: Tag agrees with package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.artifacts.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      # The single gate between a build and an index that never forgets it. The
      # script owns what "valid" means (frontend bundle present and from this
      # revision, metadata, licence files, entry points) and exits non-zero when
      # it is not; this workflow deliberately knows none of those rules, so
      # tightening them is a change to one file and not to the release pipeline.
      - name: Validate the release artifact
        run: uv run python packaging/verify_release_artifact.py "${{ steps.artifacts.outputs.wheel }}"

      # The second half of the same gate, and a different question. The artifact
      # check above proves the wheel is internally well-formed without ever
      # looking at the tag or the source; this one proves the tag, the tree, and
      # the wheel describe *one* release - the versions in `pyproject.toml`,
      # `__init__.py`, the reporting routes and the wheel's metadata; a changelog
      # entry that is not still under `## [Unreleased]`; publishable
      # `[project.urls]`; the entry points README and RELEASING tell a user to
      # run; and the per-store schema stamps.
      #
      # The tag is passed explicitly rather than left to the script's
      # `$GITHUB_REF_NAME` fallback, because the `workflow_dispatch` path has no
      # tag at all and would otherwise skip this entirely. An alpha published to
      # TestPyPI is still a published artifact, so it is validated against the
      # tag the tree claims it would be cut as.
      - name: Validate the release unit
        env:
          VERSION: ${{ steps.artifacts.outputs.version }}
          WHEEL: ${{ steps.artifacts.outputs.wheel }}
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            v*) ;;
            *) tag="v${VERSION}" ;;
          esac
          echo "Validating the release unit as $tag"
          uv run python packaging/verify_release_unit.py --tag "$tag" "$WHEEL"

      # Uploaded once and downloaded by every later job, so the bytes that are
      # published, attached to the Release, and hashed into the update manifest
      # are provably the same bytes. Rebuilding per job would give three
      # artifacts that only probably agree.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The desktop artifacts, on Windows because they are Windows binaries and
  # PyInstaller cross-compiles nothing. Independent of `build` rather than
  # downstream of it: they share no bytes - the wheel is a source distribution of
  # the same tree, the bundles are a frozen interpreter with that tree inside -
  # so serialising them would only add ten minutes to every release. `build`'s
  # tag-agrees-with-version check still gates the release as a whole, because
  # `github-release` needs both.
  #
  # Skipped on the TestPyPI dispatch path for the same reason `github-release`
  # is: that path publishes a wheel for validation and deliberately creates no
  # Release, so there is nowhere for a 400 MB installer to go.
  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.index != 'testpypi'
    runs-on: windows-latest
    # PyInstaller collects spaCy, misaki, tree-sitter grammars and the WebView2
    # stack; the app bundle alone is several minutes, and the installer's
    # `lzma2/max` pass over the result is several more.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The one cache in this workflow, and it is here because this is the one
      # job whose install is enormous: the desktop build closure is spacy,
      # ctranslate2, onnxruntime, tokenizers and the tree-sitter grammar pack -
      # roughly 400 MB of wheels fetched from PyPI on every release. Keyed on
      # `uv.lock` by the action's default glob, so a dependency change misses and
      # refills rather than serving a stale wheel.
      #
      # PyInstaller's own workpath is deliberately NOT cached, which the Phase 21
      # audit item asked for and the measurement does not support. `build_desktop`
      # passes `--clean`, which deletes the workpath and the bincache before
      # analysing anything, so a restored cache would be downloaded and instantly
      # thrown away. Dropping `--clean` to make it count was measured and rejected
      # - PyInstaller re-analyses whenever a source file is newer than the last
      # build, which is every real build, so the two arms came out
      # indistinguishable. The full numbers are in the comment on
      # `build_desktop.build_app_bundle`. Caching it here would trade a tagged
      # release artifact derived from an analysis this runner did not perform for
      # a saving of roughly zero.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm --prefix frontend ci

      # The full build closure, and every part of it is load-bearing.
      # `desktop` is the tray and the WebView; `voice-local` reaches the LGPL
      # `num2words` that `verify_bundle_licenses` requires as readable source
      # under `_internal/`; `package` is PyInstaller itself. The short form of
      # this command is the documented trap - it silently strips PyInstaller.
      - name: Install the build closure
        run: uv sync --extra desktop --extra voice-local --group package

      # Builds the frontend into the package, runs PyInstaller for all three of
      # `dist/swe-mux`, `dist/swe-mux-supervisor` and `dist/swe-mux-cli`, verifies
      # the app bundle's license posture and the client's membership, smokes the
      # client's launchers, and writes `bundle.json`. Nothing here passes
      # `--skip-supervisor` or `--skip-cli`: the installer carries all three, and a
      # runner has no live supervisor whose exe could be locked against the
      # rebuild and no `swemux` sitting in a terminal holding the client's.
      - name: Build the desktop bundles
        run: uv run python packaging/build_desktop.py

      # The artifact the in-app updater consumes. Its name is
      # `update_install.release_archive_name`, derived rather than spelled out,
      # so this step cannot publish something no installed copy will look for.
      #
      # It writes **two** files, and the second is why an update stopped being a
      # multi-minute rewrite of 420 MB: `swe-mux-<version>-<platform>.files.json`
      # is the per-file hash manifest (`swe_mux/bundle_manifest.py`), published
      # so the updater can hard-link every file the machine already has instead
      # of writing it again and paying for it to be scanned. This workflow needs
      # no step for it - `github-release` uploads `dist/*` and `update-manifest`
      # enumerates that same directory, so the sidecar gets a `version.json`
      # entry with a real SHA-256 by construction, which is precisely the
      # property the comment on those jobs claims and this is its first test.
      - name: Package the portable archive
        run: uv run python packaging/package_desktop_release.py --bundle dist/swe-mux --out dist/release

      # Inno Setup ships on the `windows-latest` image (the image's own test
      # asserts `Get-Command iscc` resolves), so this normally prints a version
      # and moves on. The install is the fallback for an image that drops it -
      # written as a conditional rather than an unconditional install because
      # paying two minutes of Chocolatey on every release to guard against a
      # change that has not happened is the wrong trade.
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc /? | Select-Object -First 2
          } else {
            Write-Host "Inno Setup is not on this image; installing it"
            choco install innosetup --no-progress -y
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # No signing: `SWE_MUX_SIGNTOOL` is unset here and the script says so and
      # builds unsigned. There is deliberately no secret and no conditional
      # signing step, because a step that fails when a certificate has not been
      # bought is a red release for a decision nobody has made yet
      # (`RELEASE_MANUAL_TASKS.md` § 1).
      - name: Build the Windows installer
        run: uv run python packaging/build_installer.py --dist dist --out dist/release

      # Uploaded under its own name and downloaded beside the wheel by both later
      # jobs. Separate from the `dist` artifact rather than merged into it
      # because the two are produced by two jobs on two operating systems, and an
      # artifact written by both would be a race.
      - name: Upload the desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/release/
          if-no-files-found: error

  # Two publish jobs rather than one with a computed index URL. The URL decides
  # where a package permanently lands, so it is written literally in the job that
  # uses it and guarded by a literal condition - an expression that silently
  # evaluates to the wrong one publishes to the wrong index, and PyPI does not
  # let you take a filename back.
  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment name is half of the trusted-publisher identity on
    # TestPyPI's side; renaming it here without renaming it there fails the
    # exchange rather than publishing to the wrong place.
    environment:
      name: testpypi
      url: https://test.pypi.org/p/swe-mux
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || inputs.index == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/swe-mux
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # No `repository-url`: the action's default is PyPI, and stating it would
      # be a second place for the two to drift apart.
      - uses: pypa/gh-action-pypi-publish@release/v1

  # GitHub Releases is the distribution channel for the frozen desktop app and
  # the fallback for the update check when the site is unreachable, so the same
  # artifacts live in both places on purpose.
  github-release:
    needs: [build, build-desktop, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.index != 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Into the *same* directory, so the `gh release upload dist/*` below needs
      # no second invocation and the manifest job's `Path("dist").iterdir()`
      # enumerates every published artifact without knowing any of their names.
      # That enumeration is why nothing downstream had to learn about the
      # installer: adding a file here adds a manifest entry.
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist/

      # The body of the Release, written before it is created so a changelog that
      # cannot produce one stops the job rather than publishing something else.
      #
      # This step exists because the alternative was silently wrong for three
      # releases. `gh release create --generate-notes` produces GitHub's own
      # commit list and compare link, so v0.1.3 published with a one-line body
      # while `RELEASING.md` had been stating the contract as "a Release whose
      # body is the new `CHANGELOG.md` section" the whole time. Nothing could
      # notice: a generated body is a perfectly well-formed release body, just
      # not this project's, and `CHANGELOG.md` is deliberately hand-written from
      # what changed for a user rather than from commit subjects.
      #
      # **There is deliberately no fallback.** A release whose notes are wrong is
      # worse than a release that stops and says why, because the notes are what
      # a user reads and nothing downstream re-examines them. The script exits
      # non-zero when the section is missing or empty, and this job ends there.
      #
      # The runner's own `python3` rather than uv, as in `update-manifest` below:
      # the script and the two modules it imports are standard library only, so
      # installing a toolchain here would buy nothing. `build` has already run
      # `verify_release_unit.py` over this same file - the extractor imports that
      # module's section parser rather than carrying a second one - so by the
      # time this runs, the section has been proven present, non-empty, dated,
      # and no longer under `## [Unreleased]`.
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python3 packaging/release_notes.py --tag "$TAG" --out "$RUNNER_TEMP/notes.md"

      # `gh` rather than a third-party release action: it ships on the runner, it
      # authenticates with the automatic token, and it is one fewer external
      # action with write access to this repository's releases.
      #
      # Create-if-missing rather than create: a tag pushed from a local checkout
      # has no release yet, while a tag pushed after a draft release was prepared
      # by hand does, and both are normal. `--clobber` makes a re-run of a failed
      # publish idempotent instead of erroring on an already-uploaded asset.
      #
      # The notes are applied on **both** paths, not only on create. The draft
      # path above is exactly the one where a body written by hand would survive
      # into publication, which is the gap this closes rather than a case worth
      # preserving: `RELEASING.md` makes the changelog section the body, so a
      # draft's prose is a rehearsal of it and not a second source. It also makes
      # a re-run of a failed job converge - the same input produces the same body.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=""
          if printf '%s' "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then
            prerelease="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
          fi
          gh release upload "$TAG" dist/* --clobber

  # The update-check endpoint. See the comment on the write step for the path
  # contract; it is the one thing here that installed copies depend on.
  update-manifest:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with `deploy-site.yml`. Both workflows deploy the same site, and
    # Cloudflare serves whichever deployment finished last - so a site commit
    # landing during a release would otherwise publish a site with no
    # `version.json` in it. `cancel-in-progress: false` because the loser here
    # must wait, not be dropped: a cancelled release deployment leaves the
    # manifest a version behind with nothing reporting it.
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    # `contents: write` is for `gh release upload` below, which attaches the
    # manifest to the Release. Deployment needs no Actions permission at all
    # since the move off GitHub Pages: it authenticates with
    # `CLOUDFLARE_API_TOKEN`.
    permissions:
      contents: write
    steps:
      # `master`, not the tag. The site is not versioned with the package: it
      # carries the current landing page, docs and changelog, and deploying the
      # tag's copy would silently roll back every site edit made since the tag
      # was cut. Only the manifest below is tag-derived.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The desktop archive and installer, into the same `dist/` the wheel landed
      # in. The manifest step enumerates that directory rather than listing names,
      # so both appear in `version.json` with real hashes by construction - which
      # is what the in-app updater needs: it looks its own platform's archive up
      # by name and refuses to install anything whose SHA-256 it cannot check.
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist/

      # **Path contract: `https://swemux.dev/version.json`** (`site/version.json`
      # in the deploy root, and `<pages-url>/version.json` before the custom
      # domain is live). The in-app update check polls exactly this URL, so it is
      # a published interface: the path never moves, and `schema` is bumped
      # rather than a field being repurposed, because an old installed build will
      # be reading it years from now and cannot be asked to change first.
      #
      # Every field is derived from the artifacts that were just published rather
      # than from the tag alone. The hashes in particular are not decoration: the
      # frozen-app updater verifies a downloaded artifact's SHA-256 against this
      # file before staging a swap, so a manifest with a guessed or stale hash
      # turns every update into a refusal.
      #
      # Written by the runner's own `python3` rather than assembled from shell
      # and `jq`: this step runs only on a tag, so a quoting mistake in it would
      # surface for the first time during a real release, and a script that can
      # be run and read as one piece is the version of that risk worth taking.
      - name: Write the update manifest
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          artifacts = [
              {
                  "name": path.name,
                  "url": f"{base}/{path.name}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in sorted(pathlib.Path("dist").iterdir())
              if path.is_file()
          ]
          if not artifacts:
              raise SystemExit("no artifacts to describe; refusing to publish an empty manifest")

          now = datetime.datetime.now(datetime.timezone.utc)
          manifest = {
              "schema": 1,
              "version": os.environ["VERSION"],
              "tag": tag,
              "published": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "changelog": f"https://github.com/{repo}/releases/tag/{tag}",
              "artifacts": artifacts,
          }

          out = pathlib.Path("site/version.json")
          out.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      # Also attached to the Release, and this is what makes the manifest survive
      # an ordinary site commit: `pages.yml` deploys from a checkout of master,
      # where `site/version.json` does not exist (it is generated, never
      # committed), so without a copy to restore from, the next documentation
      # typo fix would delete the update endpoint. The Release asset is the one
      # durable copy and this is its only writer.
      - name: Attach the manifest to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" site/version.json --clobber

      # The plugin catalog is deliberately NOT rebuilt here, unlike in
      # `deploy-site.yml`. It is generated from a live GitHub topic search, and
      # plugins are a side surface rather than part of what a release publishes;
      # the six-hourly schedule there is its writer. Adding the step here would
      # put a network search for third-party repositories on the release path,
      # which is a larger promise than a release needs to make.
      #
      # The consequence, and it is accepted rather than overlooked: for up to six
      # hours after a release, `/plugins/catalog.json` is absent and the page
      # falls back to the committed `catalog.js` placeholder, which renders as
      # "No validated plugins are published yet" - a confident claim where
      # "unknown" would be honest. The app is unaffected; it reads the
      # unreviewed topic directly when the catalog 404s. Fixing the page's
      # wording is its own change, not this one's.
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report the deployment URL
        run: echo "Deployed ${{ steps.deploy.outputs.deployment-url }}"
