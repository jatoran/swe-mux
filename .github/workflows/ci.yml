# CI gate for swe-mux.
#
# Two jobs, because the two questions are different.
#
# `verify` (windows-latest) is the full gate on the proving platform: ruff, mypy,
# the whole pytest suite including the real-ConPTY integration tests and the
# harness-adapter coverage matrix, the frontend typechecks and unit suite, the
# production build, and the Playwright renderer suite. Windows remains where a
# regression must be caught, because that is where the app ships.
#
# It also builds and installs the wheel, because "the tests pass" and "the thing
# we ship works" are different questions and the second one has its own failure
# mode: the wheel's frontend is gitignored build output that hatchling includes
# only if it happens to be on disk, so a wheel built without one is a normal
# build with no UI in it. That is checked on every push here rather than only in
# `release.yml`, where the first person to see it would be a user.
#
# `platform` (ubuntu + macos) exists because Phase 10 made the package importable
# and runnable off Windows, and an unexercised port breaks silently a few features
# later. It runs the suite on each POSIX target - the platform seam tests inside it
# are the ones that matter, and they are marked per host rather than mocking
# `sys.platform`, because a test that mocks the platform proves nothing about the
# platform.
#
# macOS is `continue-on-error`. That is a deliberate, visible statement rather than
# a way to ignore failures: every POSIX path is written and typechecked for macOS,
# but nothing had ever run there, so the first red was expected to be about the
# runner rather than about a regression. It is wired up so the gap is measured
# instead of assumed, and the flag comes off the moment it passes once.
#
# It has now run once (2026-08-27) and produced exactly the two findings it was
# built to produce, both since fixed: an unsynchronised read of a PTY child's
# process group that any contended POSIX host loses, and a test fixture that
# assumed `/bin/sh` forks a lone `-c` command, which dash does and the bash macOS
# ships as `/bin/sh` does not. Neither could be confirmed without a macOS host,
# so the flag stays until a run is green. See
# `.docs/development/CROSS_PLATFORM_FINDINGS.md` § What the first macOS run
# actually found.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      # `voice-local` is optional to install but not optional to test: the real
      # misaki G2P tests are `importorskip`-guarded, so a bare sync turns them
      # into silent skips rather than failures. The Linux job below deliberately
      # syncs bare, which is what proves the package still imports without it.
      - name: Sync backend
        run: uv sync --extra voice-local

      - name: ruff
        run: uv run ruff check src/swe_mux tests packaging

      - name: mypy
        run: uv run mypy

      # Each host's PTY, ownership and secret implementation is typechecked under
      # its own platform, on every runner. Without this, half the platform code is
      # invisible to the type checker on whichever machine happens to run the gate.
      - name: mypy (POSIX implementations)
        run: >-
          uv run mypy --config-file mypy-platform.toml --platform linux
          src/swe_mux/pty_backend_posix.py
          src/swe_mux/posix_process_group.py
          src/swe_mux/posix_guardian.py

      - name: mypy (Windows implementations)
        run: >-
          uv run mypy --config-file mypy-platform.toml --platform win32
          src/swe_mux/pty_backend_windows.py
          src/swe_mux/win_jobobj.py
          src/swe_mux/secret_cipher_windows.py

      # Mirrors `.worktree-verify`'s pytest step exactly, distribution flags
      # included. `--dist loadgroup` is what honours the `xdist_group` mark that
      # keeps each real-console file on a single worker; see the script and
      # CLAUDE.md § Verification.
      #
      # The `-m` expression is copied from that script byte for byte, and drift
      # in it is the failure mode to guard against: it is the only place a live
      # mark is excluded, so a mark the script deselects and this does not turns
      # into a red gate against a third-party service rather than against the
      # code. `live_edge_tts` was exactly that - `tests/test_live_edge_tts.py`
      # reaches Microsoft's hosted Edge TTS endpoint, which no CI runner should
      # be calling and which would have gone red on all three runners the first
      # time this workflow ran in public.
      #
      # That drift is now asserted rather than remembered:
      # `tests/test_live_daemon_guards.py` reads this file, `.worktree-verify`
      # and `CLAUDE.md` and fails when any of the three stops deselecting a live
      # mark. `live_daemon` is deselected here like every sibling and then run by
      # its own step below, which is the only live tier a public runner can run.
      - name: pytest (incl. ConPTY integration + harness adapter matrix)
        run: >-
          uv run pytest tests -q -n auto --dist loadgroup --durations=25
          -m "not live_agent and not live_subagent and not live_telemetry and not live_quota and not live_automations and not live_mcp and not live_edge_tts and not live_daemon and not live_model_flag"

      # The one live tier that needs no provider, no credential and no quota, so
      # it is the only one a public runner can run. It starts a real daemon - in
      # process for the startup phases and the session round trip, and as a real
      # `muxd` subprocess for the lifecycle half - on an OS-allocated port under
      # the test's own temp data directory. It never touches 8765 or `~/.mux`,
      # which is what makes it safe on a shared runner.
      #
      # A separate step rather than a widening of the `-m` expression above:
      # this one binds ports and spawns shells, and "did the daemon start on this
      # host" deserves to be its own red or green rather than one line inside
      # 5400 other results.
      - name: pytest (live_daemon)
        run: uv run pytest tests/test_live_daemon.py -q --durations=10 -m live_daemon

      # The supervisor is a separate process that logs to its own file rather
      # than to stdout, so when a supervisor test goes red on a runner the CI
      # log contains nothing about why - the absence of a warning proves
      # nothing, which is exactly what stalled the cwd-anchor finding in
      # RELEASE_MANUAL_TASKS.md § 8.5.
      #
      # The cwd-anchor assertion now builds its own report inline (see
      # `_cwd_anchor_report` in `tests/test_pty_supervisor.py`), because an
      # answer that travels with the failure beats one that travels with the
      # run. This step is for every other way that file can go red - a connect
      # timeout or a hung spawn produces no assertion message at all.
      #
      # Copied rather than uploaded in place: pytest's basetemp lives under the
      # user TEMP, not the workspace, and the copy happens after the run so the
      # path lengths the test actually used are left alone.
      - name: Collect supervisor logs
        if: failure()
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'supervisor-logs'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'pytest-of-*' -ErrorAction SilentlyContinue |
            Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'supervisor*.log*' -or $_.Name -eq 'crash.log' } |
            ForEach-Object {
              $flat = $_.FullName.Substring($env:TEMP.Length).TrimStart('\') -replace '[\\/]', '_'
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $dest $flat) -ErrorAction SilentlyContinue
            }
          Get-ChildItem -LiteralPath $dest | Format-Table -AutoSize

      - name: Upload supervisor logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-logs
          path: ${{ runner.temp }}/supervisor-logs
          if-no-files-found: ignore

      # 22, not 20: `npm test` runs `node --experimental-strip-types test/all.ts`,
      # and that flag does not exist before Node 22.6 - on 20 the runner answered
      # `node: bad option` and the suite never started. It went unnoticed because
      # every earlier CI run failed before reaching this step, and because the
      # development host is on 22. `frontend/package.json` now declares the
      # matching `engines.node` so the requirement lives with the script that
      # needs it rather than only here.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm --prefix frontend ci

      # `run check`, not `exec tsc -- --noEmit`: under `--prefix` the latter does
      # not forward the flag, so tsc typechecks nothing, prints its help text and
      # exits 1. That went unnoticed until the first public CI run, because every
      # earlier run failed at pytest and skipped every step after it. Running the
      # package script also restores the `precheck` xterm patch verification that
      # `exec` bypassed, and matches the `check:tests` step below.
      - name: Frontend typecheck
        run: npm --prefix frontend run check

      - name: Frontend test typecheck (unit suites + renderer harnesses)
        run: npm --prefix frontend run check:tests

      - name: Frontend unit tests
        run: npm --prefix frontend test

      - name: Frontend production build
        run: npm --prefix frontend run build

      # The three steps below ask the artifact question rather than the source
      # one, and they can only be asked *here*, immediately after the build
      # above. The wheel's frontend comes from
      # `[tool.hatch.build.targets.wheel] artifacts` globbing
      # `src/swe_mux/static/**`, which is **gitignored build output**: on a clean
      # checkout that directory does not exist, so a wheel built before that step
      # contains no UI, builds cleanly, installs cleanly, and serves a blank page
      # to every user. `release.yml` catches that at release time; a release-only
      # gate finds it on the day it is most expensive to find.
      #
      # Measured on the primary Windows host rather than estimated: 1.5s to
      # build the wheel, 0.3s to validate it, and 7.7s for the install smoke
      # with `UV_CACHE_DIR` pointed at an empty directory, which downloaded
      # 161 MB. That is well under a minute against this job's 30-minute
      # budget, so the timeout is left alone.
      #
      # Migration compatibility - the other half of the Phase 11 CI item - is
      # deliberately NOT a step here. It is `tests/test_migration_compatibility.py`,
      # which opens a `mux.db` generated by an older revision's own store code
      # (`tests/support/legacy_database.py`), so the pytest step above already
      # runs it on all three runners rather than only on this one.
      - name: Build the wheel
        run: uv build --wheel

      # `shell: bash` for the glob and nothing else: PowerShell passes `*.whl`
      # through to a native command unexpanded, so the default shell would hand
      # the scripts a literal asterisk. The version is not hard-coded here on
      # purpose - a step that names it keeps working after a version bump while
      # validating a wheel that is no longer there.
      - name: Validate the release artifact
        shell: bash
        run: uv run python packaging/verify_release_artifact.py dist/*.whl

      # Installs into a throwaway virtualenv with no checkout on `sys.path` and
      # no Node - which is the whole point, because a checkout satisfies every
      # check in the script by itself. It starts no daemon and binds no port:
      # the daemon owns a fixed port and one data directory, both process-wide
      # singletons, so a CI job that started one would be racing whatever else
      # this runner is doing.
      - name: Artifact install smoke
        shell: bash
        run: uv run python packaging/install_smoke.py dist/*.whl

      - name: Install Playwright Chromium
        run: npm --prefix frontend exec playwright install chromium

      - name: Browser smoke (Playwright renderer suite)
        run: npm --prefix frontend run test:renderer

  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.unproven }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            unproven: false
          # Run once, two findings fixed but unconfirmed there. See the header.
          - os: macos-latest
            unproven: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      # Deliberately bare: no extras. This is the leg that proves `pip install
      # swe-mux` still yields an importable package now that the voice closure
      # sits behind `voice-local` - a module-scope `import onnxruntime` anywhere
      # would fail here and nowhere else.
      - name: Sync backend
        run: uv sync

      # The first milestone of the port, and still the cheapest regression to
      # catch: a stray top-level Windows import makes the whole package
      # unimportable here, and nothing else in this job would run.
      - name: Package imports
        run: uv run python -c "import swe_mux.server; print('import ok')"

      - name: CLI runs
        run: uv run mux --help

      - name: ruff
        run: uv run ruff check src/swe_mux tests packaging

      - name: mypy
        run: uv run mypy

      # Same `-m` expression as the `verify` job above and as `.worktree-verify`.
      # The three copies are kept identical on purpose; see the comment there.
      - name: pytest
        run: >-
          uv run pytest tests -q -n auto --dist loadgroup --durations=25
          -m "not live_agent and not live_subagent and not live_telemetry and not live_quota and not live_automations and not live_mcp and not live_edge_tts and not live_daemon and not live_model_flag"

      # Ubuntu only, and held off macOS deliberately rather than by oversight.
      # The macOS leg is still `continue-on-error` (see the header), and a new
      # tier added under that flag is a tier whose first regression is invisible:
      # it goes red beside an already-red leg and nobody can tell the two apart.
      # This joins macOS on the run after that flag comes off.
      #
      # It is the first thing in this workflow that starts a daemon at all. It is
      # safe on a shared runner for the same reason it is safe in a worktree: an
      # OS-allocated port and a `tmp_path` data directory, never 8765 and never
      # `~/.mux`. `install_smoke.py` still starts nothing - the *artifact* is
      # deliberately still unproven as a running daemon on any host.
      - name: pytest (live_daemon)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest tests/test_live_daemon.py -q --durations=10 -m live_daemon

      # Everything below builds and installs the artifact, and until 2026-08-28 it
      # ran on Windows only. That made "Linux is supported" a claim about the source
      # tree rather than about the thing a user installs: the package imported and
      # the suite passed here, while the wheel had never been *built* off Windows,
      # let alone installed.
      #
      # The specific hazard this closes is not hypothetical. `hatchling`'s
      # `artifacts` globs `src/swe_mux/static/**`, which is gitignored build output,
      # so a wheel built where the frontend build did not run carries no UI at all
      # and nothing fails. That is the exact defect `verify_release_artifact.py`
      # exists for, and it had only ever been checked on one platform.
      #
      # No daemon is started and no port is bound on this leg, same as the rest of
      # it. The bare `uv sync` above is deliberately left alone - the wheel build
      # needs no extras, and both scripts import only the standard library, so this
      # still proves the no-extras install path it was written to prove.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm --prefix frontend ci

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Build the wheel
        run: uv build --wheel

      - name: Validate the release artifact
        shell: bash
        run: uv run python packaging/verify_release_artifact.py dist/*.whl

      # Installs into a fresh virtualenv with no source checkout on `sys.path`, so
      # what it exercises is the installed copy rather than this one.
      - name: Artifact install smoke
        shell: bash
        run: uv run python packaging/install_smoke.py dist/*.whl
