<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The soft keyboard must overlay the page, never resize it. `resizes-content` shrank the
         layout viewport, which refitted every terminal and resized the real PTY: shrinking an
         alternate-screen PTY destroys the rows that no longer fit, because the alternate screen
         has no scrollback, so every keyboard open permanently ate part of the conversation.
         `resizes-visual` and not `overlays-content`, deliberately: both leave the layout viewport
         (and so `innerHeight`, `100dvh`, and every terminal grid) alone, but `overlays-content`
         leaves the keyboard's height unmeasurable outside the VirtualKeyboard API, and without
         that height the composer cannot be kept above the keyboard at all. Under `resizes-visual`
         the shrunken `visualViewport` *is* the measurement (`softKeyboardInset`). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <!-- The browser UI follows the app's palette, and browsers must not auto-transform an
         explicitly selected theme. theme.ts keeps both metadata values current after boot. -->
    <meta name="color-scheme" content="only dark" />
    <!-- Dark Reader's documented opt-out. swe-mux owns complete light and dark palettes;
         applying another transformation corrupts the selected theme and terminal colours. -->
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="swe-mux" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>swe-mux</title>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
