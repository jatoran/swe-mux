<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>rocket-shop - metrics</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.6 system-ui, sans-serif; background: #0e1116; color: #dde3ea; padding: 2rem 1.5rem; }
  h1 { font-size: 1.4rem; margin-bottom: 1.25rem; }
  .row { display: flex; align-items: center; gap: .75rem; margin: .55rem 0; max-width: 30rem; }
  .row span { width: 9rem; color: #9aa4b0; font-size: .85rem; }
  .bar { flex: 1; height: .7rem; background: #161b22; border: 1px solid #262d36; border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #6ea8fe; }
  .good i { background: #8bd450; }
  footer { margin-top: 2rem; color: #5b6570; font-size: .8rem; }
</style>
</head>
<body>
  <h1>Checkout metrics (fictional, like everything here)</h1>
  <div class="row good"><span>cart p95</span><div class="bar"><i style="width:6%"></i></div></div>
  <div class="row good"><span>test stability</span><div class="bar"><i style="width:100%"></i></div></div>
  <div class="row"><span>coupon file size</span><div class="bar"><i style="width:88%"></i></div></div>
  <div class="row"><span>developer patience</span><div class="bar"><i style="width:34%"></i></div></div>
  <footer>a second static preview page, so launching another preview in the demo has somewhere to go</footer>
</body>
</html>
